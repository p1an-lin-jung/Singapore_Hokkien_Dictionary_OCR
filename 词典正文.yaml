  音标:
  - ŋ⁶
  释义:
  - ①数词，表示"二"这个数目，白读音。注意："二"、"两"是同义词，用法不同：1)"十"以下的数在数数目时，口语单说以及与量词结合时，一般用"两[ŋ⁶]"不用"二"。如说"一[tsit⁸]、两[ŋ⁶]、三[sa¹]、四[si⁵]、五[ɡo⁶]"，"两[ŋ⁶]个人"，"两[ŋ⁶]蕊花(两朵花)"，一般不说"一[tsit⁸]、二、三[sa¹]、四[si⁵]、五[ɡo⁶]"，"二个人"，"二蕊花"。十以上，百以下，在表示余数时，用"二"不用"两"，如说"十二"，"四十二个"，"八十二支"，不能说"十两[ŋ⁶]"，"四十两个"，"八十两支"。2)在"百、千、万、百万、千万、亿"等单位前，说"两"不说"二"，如说"两百"，"两千万"，"两亿"，不说"二百"，"二千万"，"二亿"。但"二十万"不能说"两十万"。3)在"百、千、万、亿"数之后连着下位的数目是"二"而又省略其下位级数"百、千、万、"时，也用"二"不用"两"，如说"两百二(二百二十)"，"三万二(三万两千)"，"九亿二(九亿两千万)"，不说"二百两[ŋ⁶]"，"两百两[ŋ⁶]"，"三万两[ŋ⁶]"，"九亿两[ŋ⁶]"。但如不省略下位数的级数时，多用"两"不用"二"，如说"三万两[ŋ⁶]千"，"九亿两[ŋ⁶]千万"，不说"三万二千"，"九亿二千万"，但仍说"两百二十"，不说"两百两[ŋ⁶]十"。4)在表示序数时，绝大多数情况下用"二"不用"两"，如说"第二名"，"(第)十二名"，"1929年[it⁷⁻⁸
    kau³⁻¹¹ (dzi)⁶⁻⁵ kau³⁻¹¹ ni²]"，不说"第两[ŋ⁶]名"，"第十两[ŋ⁶]名"，"19两[ŋ⁶]9年"。但要说"公元两[ŋ⁶]千年"，却不说"公元二千年"。
  - ②表示数目在"二"之上下，相当"两三"或"三两"之间或者"仅有少数几个"这样的数目：互我讲~句(让我说两三句，让我说几句)
