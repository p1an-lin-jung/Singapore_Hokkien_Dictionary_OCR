- id: 5378
  正文页码: 269
  pdf全文页码: 335
  词条: 了
  音标:
  - liau³
  释义:
  - ①完毕，了结，结束；耗光，没剩余：代志～未(事情了结了吗?) | 钱～咯(钱耗光没剩余了)
  - ②耗费；损失：旧年破病看老君，～真多镭(去年生病找医生医治，花了很多钱) | 火烧厝，～去真多物件(房屋发生火灾，损失了许多东西)
  - ③用在某些动词后做补语，相当华语“完”、“干净”等：即碗饭你食会～食飨～(这碗饭你吃得完吃不完?) | 镭用～则侩来拿(钱用完了再来拿)
  - ④在两个连续进行的动作中，“了”放在第一个动作后，既表示第一个动作的完成或实现，同时，也使第一个动作兼有表示时间概念的意味，相当于“…(之)后”的意思。有时，可在第二个动作前用“则(才,再)”呼应：食～紧行，无煞赴了(吃了以后赶快走，要不赶不上趟了)
    | 去佢厝～则转来找我(去他家后才回头来找我)
  - ⑤助词，放在句末，表示动作或变化的完成；表现出现新情况；含有催促或劝止的意味：花开～ | 出日～ | 怀通俗等～(别再等了)
  - 注意：此地句末助词，用“了”比用“咯”多，而且，做助词的“了”，一般都不读轻声
  例句: []
