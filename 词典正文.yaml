  释义:
  - 农历正月初九，是玉皇大帝的诞辰，故曰“天公生”。崇拜仪式也很隆重。旧时，许多家庭都在节前做了“红龟”和“甜粿”，“发粿”以及“架脚龟 [ke³⁻¹ kha¹⁻⁶ ku¹]”、“红圆(红色的包子)”
    甚至 “牵 [khian (kheŋ)¹]” 等，并于初八夜晚开始摆设供桌。一定要有两根直而长的甘蔗，绑好放在大门口，并放长钱，据称这是为了纪念“甘蔗园得救”这一历史事件而设的。有的祭上三牲或五牲,有的以五果六斋为主,还有“龟”、“粿”以及水果、斋菜等来“供
    [ken⁵]”天公”。是日,要烧“金”放鞭炮,虔诚跪拜天公祈福。有趣的是,旧俗有一些禁忌:这一日不得晒女裤,倒马桶;拜天公所用的鸡要阉过的鸡,不能是母鸡
