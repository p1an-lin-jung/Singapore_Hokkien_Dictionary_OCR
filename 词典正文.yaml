  释义:
  - 从春节前（腊月）的下半月开始，一般是在农历十二月二十四“送灶神”之后，各家各户都要进行较大规模和较彻底的室内外大扫除活动。“筅”，刷扫之谓也，“尘”，炉灶煤烟等尘土也。“筅尘”，就是来一次动作较大、范围较广的卫生大扫除。扫除的范围，除家室、厨房、厕所外，还包括门庭四周，走廊过道；扫除的对象，大至地板、天花板，中至各种家具，小至各种器皿用具，都要过细地冲刷擦洗，做到窗明几净，珠丝不挂，里里外外，整洁一新
