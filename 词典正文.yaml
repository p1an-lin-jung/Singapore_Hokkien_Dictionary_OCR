  释义:
  - 给出生的婴儿取名字。旧时人们认为，名字起得好不好，会影响到婴儿一生的前途，所以十分重视命名的事。较为传统的家庭，常按祖先留下的表明辈序的字来取名。例如，某孩子所属辈序是“忠”，即必须在头字是“忠”的情况下在其下面再添一个字，如“忠义”、“忠保”、“忠守”等。有的家庭还有女辈辈序的字。传统的家庭里，还要查出新生婴儿的“八字”，并确定“八字”中所具的原素，如其缺少某一原素(在华人的观念里，世界是由“金”、“木”、“水”、“火”、“土”五大原素组成)，则在其名字中必须含有
    所缺原素意义的字或以此原素作偏旁的字。如缺“火”，即取名“火炎”、“炳煌”、“烈甫”等。还有从继承优良道德，
  例句: []
