  释义:
  - 旧俗，有人在婴儿出生满四个月的时候日，也要庆贺一番。这种庆贺活动是在祀神后，举行所谓“收澜[siu¹⁻⁶ nua⁶]”的仪式，意思是收拾婴儿口边的垂诞水，收了涎水，婴儿的发育会更加顺利。方法是：以酥饼一类的食品十二块或二十四块，用红线串挂在婴儿胸前，请长辈或亲朋取其中的一个酥饼，在婴儿嘴唇做揩抹状，然后念个吉祥的诗句或韵语。旧俗还有“拜床母[pai⁵⁻³
    tshŋ²⁻⁵ bu³]”的，也是祈求给婴儿平安。旧俗做四月日，婴儿的外婆家要送“头尾”，即衣着之类的东西，其中“领垂[am⁶⁻⁵ se²]”、“肚腰[to³⁻¹ io¹](肚兜)”是不可少的，此外有鞋帽等，同时婴儿家这一方还要送染有粉红色的汤圆，叫“四月日圆”，要分赠“汤圆”给亲朋邻里，有的还要设宴请客
  例句: []
