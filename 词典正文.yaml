- id: 1359
  正文页码: 61
  pdf全文页码: 127
  词条: 阿叔
  音标:
  - a¹⁻⁶ tsek⁷
  释义:
  - 叔叔
  - 尊称年纪与叔叔同辈分的男性
  例句:
  - 如果称呼的“阿叔”不是亲属关系，称呼者总认为被称呼者在年龄上与自己的父亲是同辈人，因此，“阿叔”可以是中年人，也可以是老年人。“阿伯”、“阿姆[m³]”、“阿婶”、“阿嫂”等如属非亲属关系的，称呼者常从自己的年纪出发来判断，如四十岁的人称呼一个年纪比自己大的男性或女性时，如认为他或她与父母亲同辈时，即可叫“阿伯”、“阿叔”、“阿姆”、“阿婶”；如认为与自己同辈，男性一般称“先生”，女性有时可称“阿嫂”。
  - 马来语吸收该词，新加坡马来人也使用。〈马〉148页“encek 翁叔，阿叔/en-cik/。” || 注：泉州话叫“引叔[in³⁻¹tsiak⁷]”。马来语吸收该词后，语音有些变化。/另：马来语也吸收单音词“叔”，新加坡马来人也使用。
  - 〈马〉90-91页：“cek 叔叔/cik；en-cik/。”新加坡英语也吸收该词。〈SE〉5页：“ah chek The Hookkien word ah chek is used as a term
    of respect for an old man. The corresponding feminine form is ah soh. They have the same meaning as
    the SgE terms uncle and aun-tie(see auntie)。”
