  词条: 着
  音标:
  - tioh⁸
  释义:
  - ①碰触；挨上：脚会～地脥(脚能碰触到地上吗?)｜～寒～热(受冷受热)
  - ②正中；对上：拍～(打中)｜～马标
  - ③轮到；该：我唱了咯，～你唱的(我唱完了，该(轮到)你唱的了)
  - ④用得着，需要：即项代志，～我抑怀免我(这事用得着我吗?)
  - ⑤对，正确：我讲～，你讲伓～(我说得对，你说得不对)
  - ⑥放在动词前，相当华语“得”、“应该”、“须要”：你～行较紧咧，若无飠飠赶上课(你得走快一点，要不然赶不上上课的时间)
  - ⑦放在动词后，做补语，表示结果：找～了(找到了)｜看脥～(看不到)
  - ⑧副词，相当华语“就”：伊从细汉～𠢕唱歌(她从小就很善于唱歌)｜伊～是我的先生(他就是我的老师)
  - ⑨副词，相当华语“也”、“都”：即班的学生，逐个～真听话(这个班的学生，每个都很听话)
  - ⑩助词，表示动作存在的状态，后面常要跟着出现另一个行为动作，并多与表示“着”(就)义的副词连接，做助词的“着”一般不变调，做副词的“着”一般要变调。整个结构有“一…就…”的意思：伊厝落去～伓起来(他一睡就起不来)｜无食怀知滋味，食～着想要侉食(不吃不知道好味道，一吃就想再吃)
  - '|| ⑥和⑩义的“着”也可读[toh⁸]。'
  - ○另见 toh⁸
