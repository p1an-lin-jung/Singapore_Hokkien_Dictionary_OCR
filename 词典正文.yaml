  释义:
  - 昔时旧俗，元宵节妇女们的重要活动之一。是夜夜阑更深，欲参加听香活动的妇女得先在自家神前烧香点烛，掷珓占卜应走的去向，然后离家往占卜所启示的方向走去。走在路上，要注意窃听路人言语，将所听片言只语带回家再掷珓占卜，判断所祈愿事项的吉凶，未婚者自然以“听香卜佳婿”为主了，也有的是“听香卜长寿”的。比如卜长寿者在路上偶然听到“面线”二字，占卜后得吉兆，即可解释为长寿吉兆。“听香”看来近似滑稽，但却反映在那个时代里妇女们企求和追求美好人生的愿望。现此俗已消失
  例句: []
