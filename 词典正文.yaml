  词条: 中元节
  音标:
  - tioŋ¹⁻⁶guan²⁻⁵tsueh⁷
  释义:
  - 农历七月十五是中元节，也是地官大帝的诞辰。佛教徒称“盂兰盆会”，民间俗称“鬼仔节”，也有叫“普度”的。整个庆祝活动其实是从初一的“开鬼门”开始，至七月三十日的“关鬼门”结束，历时一个月。对佛教来说，出自《大藏经》里的目莲救母的故事，是中元节的源头。故事叙述目莲在阴间地府受尽千辛万苦后，见其死去的母亲刘氏四娘受一群饿鬼的折磨，就用钵盆盛菜饭给她吃，结果又被饿鬼抢走。目莲向佛主求救，佛主被其孝心感动，授目莲《盂兰盆经》，并指示于七月十五日用盂兰盆盛素斋珍果供奉母亲。因此，佛教徒每年于此日都有盛大的“盂兰盆会”，以纪念目莲，褒扬目莲的孝道。道教徒则相信，每年农历七月一日起的一个月时间里，阴府要打开鬼门，放孤魂野鬼到人间来接收奉祭。为了免受鬼魂的干扰伤害，人们便做“普度”，并于七月十五日设“中元普度”，奉祀食物，焚烧冥纸，以安抚那些孤魂野鬼。旧时中元节之夜，还有“放水灯”活动。尽管佛教和道教庆祝“中元节”
