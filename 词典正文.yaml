  词条: 月饼
  音标:
  - ge⁸⁻⁵
  - piā³
  释义:
  - 中秋节的传统食品，也叫“中秋饼”。月饼圆形，既为天上满月之象征，也示人生圆满光辉和家人团圆之愿望。据传月饼始于元代，当时朱元璋领导汉人反抗元朝暴政，约定农历八月十五日这天起义，并以互赠月饼的办法把字条夹在月饼中传递消息，吃月饼的习俗便在民间传开并沿袭至今。新加坡月饼的花式品种很多，其中如广式（广东）、港式（香港）、苏式（苏州、上海）等颇享盛名。福建厦门的“会饼式”月饼近来也受一些人的青睐。这种“会饼”把月饼分为六个等级，其名称和数目分别是：“状元”一个，“对长”（榜眼）两个，“三红”（会元）四个，“四进”（进士）八个，“二举”（举人）十六个和“一秀”（秀才）三十二个，加起来共有大小月饼六十三个。它采用“跛饼[puah⁸⁻⁵
    piā³]”（博饼）的方法来决定获取月饼的等级，具体的做法是参加者抓住六个骰子往桌子中间置放的一个大碗里轻轻抛掷，每个骰子六个面分别刻上一至六的圆点标记，人们按规定的条例审视抛掷在碗里的骰子所显现的数目决定抛掷者应得等级的月饼，参加游戏的人们就是在这种“你争我夺”的热烈气氛中度过了一个难忘的中秋夜
  例句: []
