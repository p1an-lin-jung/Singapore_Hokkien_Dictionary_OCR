  释义:
  - 福建闽南木偶戏剧种之一，也叫“掌中班”。流行于闽南、台湾等地，随着闽南地区移民也流传到新加坡、马来西亚等南洋诸国。用闽南话说唱。木偶艺匠根据历史演义和民间说唱，制作出小巧玲珑、栩栩如生的各种人物形象，它本身就是一种巧夺天工的艺术精品。演出时，艺人用手掌和指头穿入木偶像里操纵，配合舞台小道具，作出剧情所需要的各种动作或武工技艺，音乐曲调，根据不同地区需要，有用“南音”的，也有用“歌仔调”的
