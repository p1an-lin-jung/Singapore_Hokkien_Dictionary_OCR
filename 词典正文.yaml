  音标:
  - m⁶
  释义:
  - ①副词。1)表示否定，用在动词和动词短语之前，表示对动作行为的否定，相当华语“不(要)”、“不(想)”、“不(愿)”等，是“要[beh⁷]”的反面。2)在一定的语境下，可单说，做否定性的回答，一般用于句首，成独词句，相当华语“不”。关于“怀”、“无”、“艙”、“未”做否定副词的差别，参见【未】说明中的辨析
  - ②助词，用在句末表示疑问，常与句中的“要”呼应。1)一般是构成是非问，可读轻声，相当华语的“吗”。2)在一定的语境或根据发问人的意愿，可成为选择问的简式，也可读轻声。
  例句:
