  - ②放句首，单说，表惊讶带疑问，相当「怎么啦」、「怎么搞的」：~(怎么搞的)，一里面变甲乱糟糟(满屋子弄得乱糟糟的)
  - ③放在句末，表疑问，相当「是不是」，回答是常用表认可、同意、赞成的「赫」呼应：你要来~？——赫(是的)
  - ○另见 heh⁷, hiah⁷
