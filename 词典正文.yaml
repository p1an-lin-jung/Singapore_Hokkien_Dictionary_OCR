  释义:
  - 一直，一向，向来
  - 《特》475页：“一路来[方]yi¹lu⁴lai²<形容词>表示在一定时间内某种动作、行为、情况、状态始终如此。例如：牛奶公司南亚区食品促销董事郭伯钧说，由于一路来他们都是从事超级市场生意，因此将传统菜市场跟超级市场合二为一，对他们来说，是一个非常大胆和创新的尝试。|闽南方言词语。‘一路来’可以修饰动词做状语，……也可以修饰名词做定语，……中国大陆用‘一直’、‘一向’、‘向来’、或‘素来’。新加坡也用‘一直’、‘一向’、‘向来’或‘素来’，但是人们在口语和书面语中都更习惯于用‘一路来’；‘一路来’的意思更接近‘一直’。”
  例句:
  - 伊～拢是在遮咧做生理（他一直都在这里做生意）‖ 新加坡华语吸收该词。
