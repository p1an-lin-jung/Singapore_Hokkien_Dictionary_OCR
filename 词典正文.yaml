  释义:
  - ①大型的工商业组织，经营产品的生产或销售，也可从事某些建设事业等
  - ②合作；合伙：即间店阮两个～的(这间商店我们两人合作经营)
  - ③共同；遮物件～食(这些东西共同食用)
  - 注意：昔时有“公司山”，它特指华人地缘社群团体的公冢地，详见【公司山】条。
  - 新加坡华语吸收该词的②③义。
  - 《特》143页：“公司【方】gong¹si¹ <动词>合作。例如：我们几个 老同学想自己创业，但是本钱不足，你能不能跟 我们公司，大家一起做生意？ <动词>共同。例如：半个西瓜我一个人怎么吃得了？你们三位都过来，我们公司吃！闽南方言词语。”
  - 马来语吸收该词，新加坡马来人也使用。
  - '《马》304页：“kongsi 1. 公司；合伙/persekutuan pedagang-pedagang; sykt/: Bbrp buah ～ baru tlh dibuka di kawasan
    itu 几间新公司已在该区开设 2. 社团，组织；团体；集体/bersama-sama a tau barga-bung dgn tujuan menjilinkan sesuatu kegiatan
    dll; perkumpulan/: ～ bersara 离职合伙人(或股东) | ～ bhd 有限公司 | ～ gelap 私会党，秘密社会 | ～ lelap (不参与经营的)隐名合伙人 |
    ～ sdh mati 已去世的合伙人 | ～ tdk bhd 无限公司 | rumah～工人宿舍。”'
  例句:
  - 宏泰私人有限～
  - 三宝石油发展有限～
  - 遮物件～食(这些东西共同食用)
