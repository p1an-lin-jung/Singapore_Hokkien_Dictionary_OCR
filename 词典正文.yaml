  释义:
  - 又叫木偶戏。
  - “傀儡”应作“嘉礼”，原来这种戏曲演出活动多是福建闽南地区民间逢婚丧喜庆时，用来酬神以示礼仪之热烈和隆重的，故曰“嘉礼”，通常可省略以“嘉礼”代表“嘉礼（傀儡）戏”。闽南地区的嘉礼戏用闽南话说白演唱，一般是“提线嘉礼”。这种戏曲的表演手段是“提线”。通常每个木偶有十六条细线系在它身上能活动的若干部位，较复杂的木偶有二三十条线系着。一个木偶的细线通常由一个人操纵，有时也有两人共同操纵一个木偶的，一主一辅，配合默契，宛如一人。现在台湾地区和包括新加坡在内的南洋诸国，也都有闽南话的提线木偶戏演出
