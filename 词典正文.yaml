  音标:
  - loŋ²⁻⁵tiam¹⁻⁶phah⁷
  释义:
  - 一种儿童游戏。相当华语的“剪刀、石头、布”游戏。一般是两人对着玩。参加游戏者齐呼一定的口令或简短的句子后，同时分别用一支手的手掌变出三种手形中的一种，这三种手形分别代表三种不同的工具或物品：剪刀(以伸出食指和中指为代表)，石头或铁锤(用拳头做代表)，布或纸(用手掌张开做代表)。一般的规则是：在剪刀与布(纸)对垒时，因剪刀可剪断纸或布，故出剪刀的一方为胜者；在剪刀与石头(铁锤)对垒时，因石头或锤子可以砸坏剪刀，故出石头或锤子的一方为胜者；在锤子与布(纸)对垒时，因布或纸可将石头(锤子)包起来，故出布或纸的一方为胜者。如果双方现出的手形都一样，即为平局，得重新齐呼口令或简短的句子再现手形，直至能比个输赢为止
    || 可能是外来语，待考
