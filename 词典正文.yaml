  - 也叫“送神”，农历十二月二十四日。有些家户要备供品送灶神回天。俗传，此日灶神要带着常年留驻人间的诸神升天述职，向天公玉皇大帝奏报人间一年来的善恶功罪，并朝贺新年，玉皇大帝则根据诸神的禀报，决定次年每户之吉凶祸福。因此，旧俗要准备“送神马”、冥纸和祭品。在祭品中要有“甜圆仔”和“龟”、“馃”等。奉祀后，将“甜圆仔”黏在灶嘴，据说这样可使灶神口角生甜，以便上天后能“好话传上天，坏话献一边”，即在天上说好话，以求吉利。送灶神要在清晨，愈早愈好，据说是早点上天，可在天宫中占得好席位。是故当日大清早，各家各户的鞭炮声便不绝于耳，焚香烧寿金，焚烧画有神马画像的神马（供诸神乘驾）等，煞是热闹
