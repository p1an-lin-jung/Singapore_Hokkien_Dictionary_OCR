- id: 3075
  正文页码: 136
  pdf全文页码: 202
  词条: 歌仔戏
  音标:
  - kua¹⁻⁶ a³⁻¹ hi⁵
  释义:
  - 台湾和福建闽南地区的地方戏曲之一。随闽南籍华人移民来到新加坡落户。“歌仔戏”的产生过程是，最先是闽南地区民间说唱“锦歌”、“采茶歌”和歌舞“车鼓弄”、“采茶仔”等传入台湾，经过“歌仔调”、“歌仔阵”等几个阶段，最终在台湾发展成“歌仔戏”，并组成“歌仔戏班”。后由台湾歌仔戏班回到福建闽南龙溪地区祭祖并在龙溪、厦门等地做了短期演出，未料引起轰动，自此歌仔戏就在闽南地区流传开来。后经艺人的不断创新，吸收民歌、山歌、褒歌和潮剧、高甲戏、京戏中的部分曲调加以改造，创造出一套新的唱腔和伴奏曲牌，称为改良调。歌仔戏用闽南方言(偏漳州音)说白演唱。主要伴奏乐器有弦、笛、琴，如“壳仔弦”(也叫椰胡)、大广弦、三弦、京胡、二胡、唢呐、海笛、月琴和单皮鼓、堂鼓、铙钹铜锣等。传统剧目有五百多本，如“三家福”、“狸猫换太子”、“目莲救母”等。在福建闽南地区，歌仔戏一度也曾叫做“芗剧”。在新加坡，由于福建地区几个戏剧剧种中，歌仔戏流行较盛，故把歌仔戏叫做福建戏。民间中有不少歌仔戏的戏班子。每逢节日和各种酬神活动，都有歌仔戏的公开演出活动，其中福建公会的歌仔戏班还移植改编了大戏，如红楼情殇等。此外，台湾、福建闽南地区歌仔戏剧团也多次来这里演出交流
  例句: []
- id: 3076
  正文页码: 136
  pdf全文页码: 202
  词条: 高甲戏
  音标:
  - ko¹⁻⁶ kah⁷⁻³ hi⁵
  - kau³⁻¹ kah⁷⁻³ hi⁵
  释义:
  - 又名戈甲戏。泉州地区籍华人也有读[kau³⁻¹ kah⁷⁻³ hi⁵]的。原是福建闽南地区，主要是泉州、厦门地区的地方戏曲之一。高甲戏本是明末清初闽南民间过年过节或迎神赛会时，乡人自扮梁山好汉所做的简短的武打表演，到了清代中叶，渐渐发展成有故事情节，出现了戏班子，称“宋江戏”。因剧目多是武打戏，演员手执戈甲，故也称做“戈甲戏”。之后受昆腔、弋阳腔和京戏的影响，发展成具有独特风格的闽南地方剧种。由于泉州话“戈”和“高”同音，所以也叫“高甲戏”。“丑”是高甲戏里很重要的行当，“丑”分男女丑、文武丑、长衫丑短衫丑、师爷丑捆身丑、夫人丑媒人丑等达几十种人物和典型动作，“丑角戏”善于夸张，因而使高甲戏富有独具的特色。高甲戏用闽南话(偏泉州音)说白和演唱。伴奏乐器有琵琶、大小唢呐、二弦、三弦、洞箫、品箫以及大小鼓、百鼓、小叫、响盏和锣钹等。传统剧目有六百多个，如“笋江波”、“桃花摆渡”等。高甲戏在新加坡闽南籍华人中有一定的影响
  例句: []
