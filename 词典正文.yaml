  词条: 上元
  音标:
  - siong⁶⁻⁵guan²
  释义:
  - 农历正月十五为元宵节，也是天官大帝诞辰。据云，唐代以正月、七月和十月这三个月的十五为“三元日”，分别把“三官大帝”(俗称“三界公”)，正月十五为上元，祀天官，七月十五为中元，祀地官，十月十五为下元，祀水官。故民间俗称正月十五为“上元”。是夜天上月圆，地上有万家举灯游街的活动，所以也把元宵称为“灯节”。元宵花灯，种类繁多，旧时寺庙挂的是彩灯，商铺挂的叫走马灯，为儿童制作的花灯更是千奇百样，表现了人们的智慧和创造。良宵佳节，万人空巷，男女老幼，或争睹花灯，或拜宫庙，或参加“灯猜”。昔日旧俗还有“听香”、“钻灯脚”、“照月光”、“偷葱莱”、“弄元宵”等娱乐活动，以寄托人们美好的愿望，尽兴进行各种热闹而有趣的活动
