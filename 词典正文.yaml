  词条: 清明
  音标:
  - tshĩ¹⁻⁶mia²
  - tseŋ¹⁻⁶beŋ²
  释义:
  - '清明本是农事二十四节气中的一个节气,值仲春与暮春之交。清明节的前一天是寒食节,俗称“三月节”。据传“寒食节”跟晋文公为了纪念介子推的故事有关,因为它跟清明节相邻,现在人们多把“寒食节”跟清明节合起来做了。清明是纪念祖先的节日,主要活动是扫墓。旧时实行“土葬”,坟墓多葬在郊野山地,故扫墓多上山祭扫,便以“行山[kiã²⁻⁵suã¹]”代称扫墓。现时提倡“火化”,骨灰多寄存在寺庙等处,所以人们也有到骨灰存放的地方如庙宇等处去凭吊祭祖的。上郊野坡岭山地扫墓,是先将先人坟墓四周的杂草清理,并用红油漆描墓墓碑上被风吹日晒雨淋而褪了色的文字,然后敬上鲜花,行礼敬拜。有的借此机会向子孙后代讲述先人的历史,缅怀先人的业绩,有的家庭还在坟墓上放着“挂纸”,俗称“压[teh⁷]墓纸”,摆上供品,以焚香烧“金银纸”来敬拜‖马来语吸收该词,新加坡马来人也使用。《马》92页:“cengmeng
    清明(节)/ hari utk org-org China menziarahi dan member-sihkan makam nenek moyang/: Org china pergi menziarahi
    dan member-sihkan ma-kam-makam nenek moyang mereka pd hari ~华人在清明节时去为他们的祖先扫墓。”'
  例句:
  - 便以“行山[kiã²⁻⁵suã¹]”代称扫墓
  - 俗称“压[teh⁷]墓纸”
