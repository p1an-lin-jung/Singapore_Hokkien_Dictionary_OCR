  音标:
  - thiau⁵⁻³be³⁻¹lun¹
  释义:
  - 跳格子，一种儿童游戏。有多种玩法。这里介绍其中一种玩法：在地上画上有层次的格子(有的画出像多层楼的房子，最后一层是半弧形的楼层)，参加游戏者按序先将规定的一粒或数粒小石子或小沙袋抛至最后一层楼层(抛出线外即取消一轮资格或其他相约的处罚规定)，然后按地上楼层的图形用单双脚轮流踩地的跳跃方式跳到半弧形楼层的下一层，这时必须转过身子蹲下来，面背地面，用手摸索自己刚才丢在最高楼层的石子或沙袋，以摸取的结果决定胜负。另一种方法是收起一只脚，用独脚的方式踢着小瓦片安全绕完各层次的格子(瓦片踢出线外或踩在线上均以失败论处，得按序排在下一轮从头来做)，参加者中看谁第一个安全绕完各层次的格子为胜者
  例句: []
