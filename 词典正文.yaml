    tshai⁵]，嫁好婿[sai⁵]（偷了人家的青菜，嫁个好夫婿乐开怀）”。偷者寻乐趣，被偷者也不介意，它表现了妇女对未来美好生活的向往，也增添了节日的欢快气氛。现此俗已不存
