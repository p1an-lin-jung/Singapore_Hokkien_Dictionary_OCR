  释义:
  - 汤圆。它的基本原料是糯米，先将糯米浸在水里，再磨成米浆，漉干后就是“粞[tshue (tshe)⁵]”，然后用手将粞掌搓成“圆”，一般不包馅，而是将“圆”放在水中滚沸后加糖。也可把“粞”染成粉红色后再掌搓成“红圆”，以表示吉利。“圆”做为一种甜品常年在一些熟食店里均可品尝到，但它又特别作为冬至节日不可缺少的传统食品。参见【冬节】
