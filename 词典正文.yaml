  音标:
  - tio²⁻⁵tsiú¹⁻⁶hí⁵
  释义:
  - 广东潮汕地区的地方戏曲，又叫潮剧。用潮汕话说白和演唱。它随潮州移民带到新加坡来。据《潮汕百科全书》（潮汕百科全书编纂委员会编，中国大百科全书出版社出版，1994年）介绍，潮州戏与南戏有密切的渊源关系，是在明清时代发展起来的，是南戏的逐渐地方化。在潮汕地区，潮州戏又有潮音戏，白字戏等的叫法。潮州戏的音乐唱腔是曲牌连缀体和板式变化体的融合，保留一唱众和，二三人以上同唱一曲以及曲尾帮唱的形式，乐器主要有唢呐、笛、二弦、大鼓、小鼓、苏鼓以及大锣等，以丑和旦的表演较有特色。剧目有一千多个，一类来自南戏，如琵琶记等，一类来自本地区故事传说，还有一类是时装戏。新加坡华族喜爱潮州戏的不少，潮州籍华人的一些会馆还组织了戏班子，与广东潮汕地区的潮州剧团有交流往来，逢年过节都有公开的演出活动
  例句: []
