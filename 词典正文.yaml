- id: 3446
  正文页码: 163
  pdf全文页码: 229
  词条: 欺
  音标:
  - kham³
  释义:
  - 傻
  - “欺”在《广韵》有两个音。一是感韵的苦感切,义为“食未饱也。”,二是合韵的口答切,义为“默痴貌”。前者音合义不合,后者义合音不合。我们音取苦感切,义取口答切。
  - 辨:“钝”、“杵”、“怣”、“欺”都有傻笨的意思。“钝”重在指天赋的迟钝,笨拙;“杵”与“钝”较接近,重在愚而不敏;“怣”和“欺”在表现傻笨这点上多可换说,不过,“怣”还有因文化落后,知识缺乏或见识不广以及生性老实忠厚等原因造成的愚蠢、糊涂和不开窍,如生活在僻远不发达地区的人到经济发达或现代化的地区,常因落后愚昧而傻眼、糊涂,言行举止现出愚蠢可笑来
  - “欺”带有神经不正常,有的还是生来就有的痴傻愚笨,因而言行举止会有与常人常理相背的表现
  - 这里一般不用“怣”来换说
  例句:
  - 一~团(傻子)
  - 看了怣怣(看了傻乎乎的)
  - 听了怣怣,怀知人咧讲甚物(听了傻愣愣的不知人家在说些什么)
  - 你敢会则欺,落雨天无要揭雨伞,在露天旷地里行(你怎么那么傻,下雨天不拿雨伞,一个人在外面走)
  - 欺癫癫
