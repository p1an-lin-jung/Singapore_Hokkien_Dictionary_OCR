  词条: 冬节
  音标:
  - tag¹⁻⁶
  - tsueh⁷
  释义:
  - 冬至，阳历十二月二十二日或二十三日。冬至是农历二十四节气的最后一个节气。此日，太阳直射南回归线（冬至线），故北半球夜最长，日最短，南半球则反之。在新加坡，汤圆是冬至必备的食品，冬至阳始生，而“圆”像太阳，更重要的是，“圆”意味着圆满、团圆。冬至吃汤圆，象征家庭和谐、团圆和美满。是日，也有些家庭拜神神明祖宗，这类家庭就以冬节“圆”作为祭拜的主要食品之一
  例句: []
