  - 《特》注：闽南、潮州方言词语。肉骨茶是一种药膳。把中药当归、北芪、熟地、党参、陈皮、豆蔻、桂皮、小丁香等加上八角茴香和冰糖之类跟排骨一起熬汤。卖这种药膳者多自称有祖传秘方，所以用料和烹饪技术因人而异。吃的时候配以白饭、油条和铁观音之类的功夫茶，所以把这种食物叫做‘肉骨茶’，‘肉骨茶’是并列结构，即‘肉骨’和‘茶’，不是以‘茶’为中心的偏正结构。‘肉骨茶’是新马的风味小吃之一。香港有人叫‘排骨茶’。台湾、马来西亚也用。英语也收入该词。英语音译为
    bahkutteh。bahkut 是闽南话‘肉骨’的对音；teh 是闽南话‘茶’的对音。
  例句:
  - 例如：演阿公的梁宝柱为了体验生活，在影片开拍前还到小贩中心实习了三个小时。爱吃肉骨茶的他打趣说，现在对怎样煮肉骨茶还很清楚，这也是个收获。
