    dua atau tiga gulung sehingga berupa tali; kucir; kuntung/：Anak perempuan itu mengikat ～那个女孩子绑辫子。|
    bertaocang 留辫子，绑辫子/mempunyai taocang; mengikat taocang/：Anak perempuan yg ～ itu sgt cergas 那个绑辫子的女孩子很活泼。”
  例句:
  - Anak perempuan itu mengikat ～那个女孩子绑辫子。
  - bertaocang 留辫子，绑辫子
  - Anak perempuan yg ～ itu sgt cergas 那个绑辫子的女孩子很活泼。
