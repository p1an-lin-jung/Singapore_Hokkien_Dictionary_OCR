  词条: 佫较
  音标:
  - koh⁷⁻⁸khah⁷
  释义:
  - 副词，通常是在比较中，表示后者比前者在程度上又深了一层，或者在数量上进一步增加或减少，相当华语“更”、“更加”
  - “较”与“佫较”都含有比较的意思，用“佫较”有强调程度更进一层的意思，用“较”就没有这更进一层的意思了
  例句:
  - 即间比迄间~大(这间比那间更大)
  - 一个一个~坏(一个比一个更坏)
  - 伊较白(她比较白)
  - 伊佫较白(她更加白)
- id: 5693
  正文页码: 291
  pdf全文页码: 357
  词条: 较
  音标:
  - khah⁷
  释义:
  - ①用在形容词前，带有比较的意味，相当华语“比较”或“形容词+一些(一点)”
  - ②在有比较与被比较对象的句子里，构成典型的比较句，“较”用在形容词前，可只作为比较句的一种标志，肯定比较对象比被比较对象达到形容词的某个性质状态甚或程度上稍加深加大些，相当华语“形容词+一些(一点)”
  - ③在“较…也(则)…”这种结构里，相当华语“再(怎么)…也才(也就)…”
  例句:
  - 昨日发烧，今仔日~好(昨天发烧，今天比较好了或好一些)
  - 我怀爱赫多，爱~少的(我不喜欢那么多，喜欢少一些或少一点)
  - 我比伊~大汉(我个子比他大一些)
  - 伊~少我三岁(他比我小三岁)
  - 苹果比梨仔~贵(苹果比梨子贵一点)
  - ~多也则半碗尔[nia⁶](再怎么多也才半碗而已)
  - ~一唱也迄规块(再怎么唱也就那几首歌)
