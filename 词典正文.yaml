  词条: 清采
  音标:
  - tshim⁵⁻³tshai³
  释义:
  - (言行举止等)随便，马虎不认真
  - 辨："滥掺"、"乱主"、"清采"虽在表示"马虎随便"这个意思方面有相似处，其中，"滥掺"和"乱主"做修饰语时有时可互相换说。但"滥掺"、"乱主"这两者跟"清采"就有一些差别。"滥掺"、"乱主"的"马虎、随便"含有"胡乱"的意思，以致其产生的言行多可造成某些破坏性或不良的后果，而"清采"重在"不经心"，这种不经心者所说和做的在主观上并不一定有"胡乱"的意图。所以"清采"不能随便跟"滥掺"、"乱主"换说。如可说"做人着较清采的"，就不好说"做人着较滥掺的"了。可重叠说成"清清采采"，以示强调和加深程度。
  - '马来语吸收该词，新加坡马来人也使用。（马）93页："cincai~lah 随便啦！随便一点吧！/tak apalah kurang sajaah！/: ~lah！Jangan bergaduh
    lag 随便吧，别再争吵了！|cincai-cincai 随随便便/tidk bersungguh-sungguh；sembarangan/Sikapnya selalu~~saja 他的态度总是随随便便的。"'
  - 新加坡英语也吸收该词。（SE）49页："chin chai This phrase，of Hokkien origin，is used in SgE as an adjective or adverb
    meaning to do something' any old how'，in a slipshod manner，because you are either in a hurry or couldn't
    care less about it：This is chin chai work，Just do it chin chai！ It also means "anything will do'：A：What
    do you want to eat？B：Chin chai。"
  例句:
  - 做人着较~的(做人不要太认真，有时也要睁一眼闭一眼随便些)
  - ~讲讲的(随便说说)
