- id: 5438
  正文页码: 273
  pdf全文页码: 339
  词条: 无
  音标:
  - bo²
  释义:
  - ①没有，表示不存在，不出现，不领有，“有”的反面：厝里～人(家里没人) | 我～即(这)本册(书)
  - ②副词，“没”或“不”。A)用在动词或动词性短语前，多做“没”解；用在形容词前，多做“不”解：～来(没来) | ～骂伊(没骂他) | 即蕊花～芳(这朵花不香) | 涂脚～清气(地板不干净) B)在动补结构的补语前，是对整个动补结构的否定，“无”多做“没”解，其肯定形式是在动补结构之间加“有”，参见“有”
    ⑥：去～厝久(没去多久) | 扫～清气(没扫干净)
  - ③用在少数动词、形容词前，表示这些动词、形容词所产生的数量少，时间短等：即款米较～煮(这种米出饭量少)
  - ④放在某些单音动词(如“看、听、找、食、买”等)后做补语，表示动作行为没达到某种效果：买～(买不到) | 较晏去煞找～人(迟去了就找不到人)
  - ▲看有食无(看得见却吃不上)
  - ⑤在一定的语境下，“无”放在下一个句的句首，并且不参与变调，它与后面的句子或词要有个短暂的停顿，这时，“无”表示对前面某一句话或说话双方彼此都能理解的某个意思做某种假设，相当华语“（如果）没有的话”的句子，以示后面的话是在这种假设下要产生的某种情形，后面的句子多有“着[tioh⁸](就)”或“则[tsiah⁷](才)”来呼应：～我着家己设法(如果没有的话，我要自己去设法了)
    | ～我怀去了(如果没有的话，我不去了)
  - ⑥连词，相当华语“要不”、“要不然”，表示在两件事情中进行选择，但实际上说话者已倾向于对所说的话的选择，虽然前一件事没说出来或没指明。这个“无”不参与变调，并且跟后面的话要有短暂的停顿：～我头先行(要不我先走了)
  - ⑦句末疑问助词，相当华语的“吗”，可读轻声，不读轻声时有加重语气的作用。通常这种疑问句里，常有“有”与之呼应。这种疑问句，根据前后语境或说话人的意图和口气，可以是是非问，也可以是选择问。但是，如果做选择问时，“无”就不是助词，而是否定副词，其后面的谓语是承前而省略了：伊有来～(他来了吗？他来没来)
    | 你有找着伊～(你找到他了吗？你找到他没找到他？) | 有人认为本字是“毛”。《集韵》豪韵莫抱切。《后汉书·冯衍传》：“饥者毛食，寒者裸跣。”李贤注：“《衍集》‘毛’字作‘无’，今俗语犹
  例句: []
- id: 5439
  正文页码: 275
  pdf全文页码: 341
  词条: 一
  音标:
  - it⁷
  释义:
  - ①数词，最小的整数，文读音。注意：“一”的文读音（下称“文读一”）和训读音[tsit⁸]（下称“训读一”）的用法有别：1）“十”以下的数在数数目时，口语单说以及与量词结合时，一般用“训读一”不用“文读一”。如说“一[tsit⁸]、两[ŋɔ⁶]、三[sã¹]、四[si⁵]、五[ɡɔ⁶]”，“一[tsit⁸]个人”，“一[tsit⁸]蕊花（一朵花）”，不说“一[it⁷]、两[ŋɔ⁶]、三[sã¹]、四[si⁵]、五[ɡɔ⁶]”，“一[it⁷]个人”，“一[it⁷]蕊花”。十以上，百以下，在表示余数时，用“文读一”不用“训读一”，如说“十一[it⁷]”，“六十一[it⁷]个”，“七十一[it⁷]支”，不能说“十一[tsit⁸]”，“六十一[tsit⁸]个”，“七十一[tsit⁸]支”。2）在“百、千、万、百万、千万、亿”等单位前，说“训读一”不说“文读一”，如说“一[tsit⁸]百”，“一[tsit⁸]千万”，“一[tsit⁸]亿”，不说“一[it⁷]百”，“一[it⁷]千万”，“一[it⁷]亿”。但“一[it⁷]十万”不能说“一[tsit⁸]十万”。3）在“百、千、万、亿”数之后连着下位的整数是“一”而又省略其下位数的“十、百、千、万”时，用“文读一”不用“训读一”，如说“两百一[it⁷]（二百一十）”，“三千一[it⁷]（三千一百）”，“九万一[it⁷]（九万一千）”，不说“两百一[tsit⁸]”，“三千一[tsit⁸]”，“九万一[tsit⁸]”。但如不省略下位数的级数“百、千、万”时，一般用“训读一”不用“文读一”，如说“三万一[tsit⁸]千”，“九亿一[tsit⁸]千万”，不说“三万一[it⁷]千”，“九亿一[it⁷]千万”，但仍说“两百一[it⁷]十”，不说“两百一[tsit⁸]十”。4）在表示序数时，绝大多数情况下用“文读一”而不用“训读一”，例如说“第一[it⁷]名”“（第）十一[it⁷]名”，“1919年[it⁷⁻⁸
    kau³⁻¹ it⁷⁻⁸ kau³⁻¹ ni²]”，不说“第一[tsit⁸]名”，“第十一[tsit⁸]名”，“191[tsit⁸] 9年”。但“公元一[tsit⁸]千年”却不说“公元一[it⁷]千年”。
  - ②在一些书面语，多数成语中，用文读一，这时，“一”不是最小的数目词，而具有多种意义：～生|统～|～举两得|举～反三|万无～失|表里如～。另见 tsit⁸
  例句: []
