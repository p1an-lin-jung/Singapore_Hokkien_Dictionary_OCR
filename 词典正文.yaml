- id: 5606
  正文页码: 286
  pdf全文页码: 352
  词条: 未
  音标:
  - be(ba, bue)⁶
  释义:
  - ①副词。1)表示否定，用于动词、形容词及其组成的短语前，表示动作行为或状态尚未发生，相当华语“还没”、“尚未”，为强调尚未发生，可与“野(还)”、“犹(还)”等副词组合
  - 2)在一定的语境下，可单说，做否定性回答，一般放在句首，成为独词句，相当华语“还没有”、“还没呢”
  - ②助词，用在句末表示疑问。1)构成是非问，相当华语的“吗”
  - 2)构成选择问句的简式
  - “未”放在句末表疑问，古汉语已用之。《史记·魏其武安侯列传》：“君除吏尽未？吾亦能除吏。”《世说新语·赞誉》：“（晋）武帝每见（王）济，辄以（王）湛调之曰：‘卿家痴书死未？’”
  - 辨：“未”、“无”、“怀”、“□”作为副词，都可对行为动作或性质状态做否定，但它们之间的差别是：“无”表示不存在的事实，造成这种事实多有主客观上的某种原因；“怀”表示主观上不愿意或不许可，尽管客观上或主观上都具备实现的条件；“□”强调能力或情况的不可能或不允许；“未”表示还没实现某种行为或状态，但可能会实现。比较下面四句话的不同：
  例句:
  - 我~食下昼(我还没吃午饭)
  - 伊野~去美国(他还没到过美国)
  - 即蕊花犹[iau³]~红(这朵花还没变红)
  - 伊来~(他来了吗?)——~(还没呢)
  - 你食~(你吃了吗?)
  - 学费你交~(学费你交了没交?)
  - 伊无来(可能因病或其他原因)
  - 伊怀来(可以来的，但主观上不愿意)
  - 伊□来(可能因病或其他原因，不允许来或不具备来的能力、条件等)
  - 伊未来(可能已在途中，或因某种原因耽搁了，但会来或可能会来的)
