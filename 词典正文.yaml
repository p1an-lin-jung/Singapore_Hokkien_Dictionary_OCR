  词条: 大坡
  音标:
  - tua⁶⁻⁵ pho¹
  释义:
  - 传统以新加坡河为大坡、小坡的分界线。新加坡河南岸的市区统称大坡。早期中国南来的移民，都聚居在大坡，福建人多在直落亚逸一带；潮州人多住在勿基和新加坡河上游两岸；广府人则多住在牛车水的广合源街、丁加奴街和史密斯街一带。因大坡移民已到了相当饱和的程度，所以后来的中国多数移民，只好另找地盘到小坡区居住和发展了
  - 早期人们都把大坡和小坡看成是新加坡这个大都市的市区，因此，常用“落坡”表示由城外到市区里去。另外，也有人用“本坡”表示新加坡本地的
  例句: []
