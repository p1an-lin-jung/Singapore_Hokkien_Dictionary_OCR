  pdf全文页码: 203
  词条: 歌仔（调）
  音标:
  - kua¹⁻⁶a³⁻¹tiau⁶
  释义:
  - “歌仔调”是歌谣和着小曲演唱的一种曲艺。它最早是将用闽南话做成的歌谣放在已流行开来的锦歌、采茶调曲谱里演唱，后来也借着歌仔戏的“七字仔”、“七字调”、“哭调仔”等来演唱。无论是从戏曲中截取片断改编的“歌仔”，还是根据大众口中流传的歌谣或是根据生活现实编写出来的歌谣、唱词，由于它极富浓郁的乡土生活情调，所用的闽南话又通俗生动，演唱形式简便，常常是只需一两把“壳仔弦”之类的乐器，便可你拉我唱，也可自拉自唱，可以两人对唱，还可夹说夹唱，因而颇受民间百姓的喜爱。一些民间艺人常轻装简从，随时随地演唱，一些江湖药贩和小贩，也乐意借此形式，有的再配上简单的武术表演，就可以在地头上摆上地摊卖唱，借此推销药物、商品。昔日的新加坡，在白天炎热开始消退的夜晚，在一些街头巷里或茶馆酒楼，都可以见到歌仔调的表演，有的还借此来推销民间秘传土药方或药膏以及其他一些小商品等
  例句: []
