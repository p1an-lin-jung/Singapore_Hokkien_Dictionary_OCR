  - (gin)²
  释义:
  - ① 一种矿物，金银的银 ② 冥纸，少单说，多与“金”这种冥纸连用，说成“金~纸”，在一定的语境下也可说“银纸”，但不能说“烧银” ③ 货币，相当于“钱”：一箝~（一块钱）|一角~（一毛钱）▲银白心肝乌（比喻金钱在有些人的眼里，会成为诱惑人们灵魂变脏变黑的腐蚀剂，驱使某些利欲熏心的人干出伤天害理的罪恶来）||
    ③ 义在表示货币单位时，要与量词“箝”、“角”等组合说“箝银”、“角银”，前头再加数词，一般不单说“银”。如“一箝银”多不说“一银”，但可说“一箝”，“一角银”可说“一角”，多不说“一银”。这些组合通常是用在“十”以下的数目，如说“四角银”、“六箝银”。“十元”以上就少用“箝银”，可直接用数字加“箝”来表达。《华夷》7-8页记载早年有“一占
    [tsiam¹] 银（沙诛申）”、“五占银（里吗申）”的说法
  例句: []
