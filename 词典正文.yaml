  释义:
  - 即服丧。死者的亲属在死者死后的一定时间里穿上孝服或戴上代表孝服的某些标志物，以缅怀、哀悼和纪念死者。依照亲属跟死者的亲疏关系，子女、儿媳、长孙一般要穿麻(麻布)孝服；孙、甥、侄辈一般要穿苎(苎布)孝服；曾孙及其同辈一般穿浅色的布质孝服；与死者同辈或外亲可穿白布孝服。孝服标志物分白、兰、青、黄等色，摺成小块后，男佩在左手腕或胸前，女性多结在头发上。一般穿的孝服可在出殡后换成标志物。如今有不分亲疏等级，一律以黑布圈套在腕上表示带孝的
    || 马来语吸收该词，新加坡马来人也使用。《马》618 页：“toaha 带孝/ kain kecil yg dililit dt lengan baju sbg tanda bersedih dll;
