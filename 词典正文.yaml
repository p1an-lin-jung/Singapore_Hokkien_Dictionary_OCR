- id: 3070
  正文页码: 135
  pdf全文页码: 201
  词条: 南管
  音标:
  - lam²⁻⁵
  - kuan³
  释义:
  - 又叫“南曲”、“南音”、“南乐”、“弦管”。是现存中国传统音乐中历史最古老的民间音乐之一。它溯源自唐代的宫廷音乐，后随中原汉人南迁后在福建泉州一带流传发展。清代入宫廷演奏后被皇帝赐于“御前清曲”。今在福建闽南地区、台湾、香港和东南亚国家广为流传。南管由“指”（即指法套曲）、“谱”（即器乐弹奏套曲）、“曲”（即散曲，也称草曲，以乐器伴奏的清唱曲）三大部分组成。基本乐器是琵琶、洞箫、二弦、三弦和拍板，有时合奏也加入笛子、唢呐、二胡、笙等。音乐缠绵柔情，古雅清优。由于它保留着现在其他音乐里已绝响或罕有的唐代曲牌，又跟当代宫廷弹奏琵琶的握法相同，加之用保留古音较多的闽南方言演唱，故有“汉唐遗音”之称。南管在新加坡流行的历史久长，各种南管演艺组织不少，其中以成立于
    1941 年的湘灵音乐社影响最大。该社致力于南管的传承，更注意创新与改良，曾于 1977 年倡办首届亚细安南乐大会奏，1984 年参加英国北威尔斯世界民族音乐歌唱比赛，荣获歌唱第三名和音乐第四名。还多次参加国际比赛，享有盛誉。1980
    年初，整理出版了保留传统南管精粹和新创的南曲《南管精华大全》，最近又与中国泉州地方戏曲研究社合编，由中国戏剧出版社出版《南音名曲选》，该书首
  例句: []
