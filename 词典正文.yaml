- id: 5806
  正文页码: 298
  pdf全文页码: 364
  词条: 的
  音标:
  - e²
  释义:
  - 结构助词。①表示修饰和领属的关系：我~册(我的书)|伊~车
  - ②可放在名词、人称代词及名词性短语后；也可放在动词、形容词和一些短语后，构成「的」字短语，这些短语就成为名词性短语：遮是人送~，怀是买~(这些是人家送的东西，不是买的东西)|我爱即领红~，无爱迄[hit⁷]领乌~(我爱这件红的衣服，不爱那件黑的衣服)
  - 「的」是训读字。在用②义时，通常不读轻声而读原调
  例句: []
- id: 5807
  正文页码: 298
  pdf全文页码: 364
  词条: 赫
  音标:
  - həh⁷
  释义:
