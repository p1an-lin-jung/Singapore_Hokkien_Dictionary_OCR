- id: 5254
  正文页码: 262
  pdf全文页码: 328
  词条: 会
  音标:
  - e(ue)⁶
  释义:
  - ①懂得；通晓。"𣍐"的反面
  - ②表示有能力（做某事）。"𣍐"的反面，后面要跟动词或动词谓语
  - ③表示有可能（实现某事）。"𣍐"的反面，后面要跟动词或动词谓语
  - ①义的本字是"解"。《集韵》蟹韵下买切："解，晓也。"晋·陶潜《九日闲居》："酒能祛百虑，菊解制颓龄。"
  - ③义的"会"放在某些动补结构之间成为可能补语，它的否定式用"𣍐"。说华语时，要把"会"换说成"得"，或者把"会"取消，在整个动补结构前加"能"。例如："即碗饭我食会了"，华语要说成"这碗
  例句:
  - 英文你~我𣍐（英文你懂我不懂）
  - 我~弹钢琴
  - 甚物人（谁）~修理电脑？
  - 我病好了，~去做工咯
- id: 5255
  正文页码: 263
  pdf全文页码: 329
  词条: 鮀
  音标:
  - bue(be)⁶
  释义:
  - ①不懂；不通晓。"会"的反面
  - ②表示没有能力(做某事)。"会"的反面，后面要跟动词或动词谓语
  - ③表示不可能(实现某事)。"会"的反面，后面要跟动词或动词谓语
  - ④句末疑问助词，相当华语的"吗"，可读轻声，不读轻声时有加重语气的作用。通常这种疑问句里，常有"会"在前面与之呼应。这种疑问句，根据前后语境或说话人的意图和口气，可做是非问或选择问，尤其是"鮀"不读轻声时，选择问的可能性会大一些。但是，如果做选择问时，"鮀"就不是助词，而是否定副词，其后面的谓语是承前而省略的
  - '"鮀"是合音词，由"无会[bo²⁻⁵ue⁶]"合音组成'
  - ③义的"鮀"放在某些动补结构之间成为可能补语，它的肯定式用"会"。说华语时，要把"鮀"换成"不"，或者把"鮀"取消，在整个动补结构前加"不能"
  例句:
  - 华语我会，英文我~
  - 我会唱歌，~跳舞
  - 伊即几日破病，~去学堂(这几天他生病，不能来学校)
  - 伊会修理汽车~(他会修理汽车吗，他会不会修理汽车?)
  - 今仔日伊会来学堂~(今天他能来学校吗，今天他能不能来学校?)
  - 即碗饭我食鮀了
