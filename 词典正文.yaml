- id: 5250
  正文页码: 262
  pdf全文页码: 328
  词条: 无法（度）
  音标:
  - bo²⁻⁵huat⁷⁻⁸tɔ⁶
  释义:
  - ①没办法
  - ②惯用语，表示无可奈何，一点办法都没有，任由它去
  - 一般来说，"无法度"比"无法"在语气上显得更强调一些。"无法度"有时也可以说成"无法无度"，这在语气上比"无法度"更强一些。但要注意，"无法无度"除有"无法度"的意思外，它还可以做为一个成语，表示"没有天理，没有公道"的意思
  - 马来语吸收该词。《马》77页："bohwat 无法，没办法，无可奈何/tdk berupaya/。"
  例句:
  - 我明仔日有代志，~去恁兜（我明天有事，没办法去你家）
  - 你若伓听序大人的苦劝，要佫甲遐人做阵，阮也~（你若是不听父母亲苦口婆心的劝告，还要再跟那群坏家伙在一起，我们也只好无可奈何，任由你去了）
