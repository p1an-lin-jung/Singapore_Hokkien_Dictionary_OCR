  词条: 岜
  音标:
  - pa¹
  释义:
  - ①丛林地带或山地；也指乡村地带。也写作“芭”
  - ②种植工场
  - 有人认为“岜(芭)”是外来语，借自马来语“pabrik”而简化。新加坡华语吸收该词。《华》10页：“岜[方]ba¹<名词>丛林地带或山地。例如：我们在山岜里住，戴卫氏(Davis)的警察部队就部署在岜边看着。回到原来的沙屎岜(锡矿场)后，没有事就铺开军用帆布席地而睡
    | 闽南方言词语。'芭'是'山芭'的简称。在新加坡未城市化之前，远离市区的乡野地区不管是否有人居住，统称'山芭'。开垦荒地叫'开芭'。已开垦的荒地叫'芭地'，砍伐树木叫'砍芭'，拾掇荒地叫'拾芭'。现在，新加坡已经城市化，'山芭'已不复存在。但是，马来西亚和印尼幅员比新加坡大得多，其广大的农村或荒山野林，人们习惯上仍把它叫做'芭'。马来西亚、印尼也用。”
  例句:
  - 烧~|剉~（砍伐树林）
  - 作~
