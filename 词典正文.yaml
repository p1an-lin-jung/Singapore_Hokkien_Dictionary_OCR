  释义:
  - ①新郎迎娶新娘回到自己的家门。进入家门后，首先这对新人要向男家的长辈“敬茶”。“敬茶”这一礼俗不仅可作为合法婚姻的证据之一，而且还表明男方接收新娘作为自己家族中的新成员，并表示对长辈的敬意。信奉佛教、道教的家，新娘入婆家门后须先向“佛祖”或其他神明敬献“红枣茶”，接着向祖先敬茶，以求赐福，然后再向新郎家中的祖父母、父母等鞠躬敬茶（旧俗要跪着敬茶，今多废）。之后，轮着向其他长辈、同辈敬茶。每位接收敬茶者，都会送个红包或其他礼物（如首饰等）给这对新人。随后，新郎新娘就和众人共享茶点或午餐，午餐食品的名称都含吉祥之意。这之后，新郎即陪伴新娘回娘家。如今也有在结婚当日的礼仪结束后设晚宴招待亲戚朋友的，叫“请结婚桌”②借指女子出嫁或与新娘家长联署发出，如双方家长都已过世，也可以新郎最亲近或最年长的亲人的名义发出。结婚属“红事”，所以婚宴的桌子应铺上红色的桌巾，象征着欢庆和好运。按照“男左女右”的习惯，新郎要坐在新娘的左边，面对所有宾客。席间，新婚夫妇要到每一桌向每一位宾客敬酒，如宴席太多，无法一一敬酒，则须由新婚夫妇连同双方的家长站在台上向宾客敬酒。切蛋糕也是新加坡人婚宴上常见的仪式。宴会毕，新郎新娘和家长要列队在宴会厅出口处，一一向离席的来宾致谢道别
