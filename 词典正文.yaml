  词条: 薄饼
  音标:
  - poh⁸⁻⁵piã³
  释义:
  - 一种食品，类似春饼。以肉（或肉制品如切片香肠等）、虾米（或蠔）、红萝卜、沙葛[sa¹koh⁷]（或生菜等）、豆芽、豆干丝、蛋丝等拌在一起炒熟后做为馅，放在用面粉做的薄皮上（有人还在薄皮上抹上辣酱或甜酱，再放上经压碎过的碎花生或花生酥，也可加上海苔等，以增加风味），然后裹卷成筒状形即成。一般是薄皮包裹着刚炒煮熟后的、具有特殊风味的馅就可以吃了，但也可以包成薄饼后再放进油锅里炸，那又是另一番风味。
  - 新加坡华语吸收该词。
  - 《特》25页：“薄饼[另]bao²bing³<名词>类似春卷的一种福建小吃。
  - 《现代汉语词典》收‘薄饼’，释义是‘一种面食，用烫面做饼，很薄，两张相叠，烙熟后能揭开’，跟新加坡所谓‘薄饼’完全不同。香港也有‘薄饼’（crepe），是一种把鸡蛋拌在面粉里烘烤后卷成圆筒形的点心，无馅。台湾也用。
  - 马来语也吸收该词，新加坡马来人也使用。《马》470页：“popia薄饼/sejenis kuih yg berisi sayur-sayuran dan berbalut dgn kepingan
    tepung yg tipis/。”
  例句:
  - 例如：在远东广场南面的直落亚逸街上，‘好彩薄饼’的侍应生端上薄饼皮、生菜、豆芽、沙葛、萝卜丝、虾米、碎花生、甜酱和辣酱等，让你亲手包薄饼。
  - 用薄如纸的面皮裹馅卷成圆柱形就可以吃了，也可油炸后吃。外形像春卷儿，但比春卷儿长而粗……
