- id: 4572
  正文页码: 228
  pdf全文页码: 294
  词条: 踚
  音标:
  - tiam⁵
  释义:
  - ①在（某个位置上）；停留：我～学堂门口等你
  - ②住宿，居住：天赫晏咯，下昏～我兜，嬡转去（天这么晚了，晚上住在我家，别回去了）
  - '||辨：“徛”、“跍”、“踚”在表示居住这个意思上是一组同义词，一般可以换说，但“徛”的意思最明确，因为“跍”、“踚”还有停留在某个位置或地方的意思，如果语境交代不明确，有时不容易分辨是在某个位置上停留或者居住。如“我即几日拢踚（跍）学堂读册”，既可理解为住在学校里，也可理解为在学校这个地方读书，可能晚上还要回家睡觉。所以，在语境不是很明确的情况下，要表示“居住”的意思，用“徛”比用“踚”、“跍”好'
  例句:
  - 我～学堂门口等你
  - 天赫晏咯，下昏～我兜，嬡转去
  - 我即几日拢踚（跍）学堂读册
