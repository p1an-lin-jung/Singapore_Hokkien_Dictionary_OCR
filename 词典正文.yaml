- id: 3852
  正文页码: 188
  pdf全文页码: 254
  词条: 揭
  音标:
  - kah(kiah, giah)⁸
  释义:
  - 训读字。本字“揭”。《集韵》屑韵徒结切：“揲，捎取也。”《文选·张衡〈西京赋〉》：“超殊榛，揲飞鼯。”新加坡用“揭[kah(kiah)⁸]”比用“拿”的频率高。
  - ①高举：～旗 ②拿；获得：～镭来(拿钱来) | ～五日假 ③抬起来：～椅 | ～头 | ～箸 | ～桌 ④(火气脾气等)往上升、冲或冒：即规日无眠，火气规个～起来(这几天没什么睡(睡眠不足)，体内火气上升)
  - 《集韵》屑韵丘桀切：“揭，举也。”方言阳入调是取屑韵巨列切的“揭”音。
  - 《淮南子·精神》：“揭镬甂，负笼土。”高诱注：“揭，举也。”
  - 《后汉书·冯衍传》：“怀金垂紫，揭节奉使。”李贤注：“揭，持也。”
  - 新加坡闽南话的“揭”和“拿[theh(thueh)⁸]”在表示“获取”这个意义上是同义词，但用“揭”比用“拿”的频率高。
  - 新加坡华语吸收该词 ②义。
  - 《特》做“拿”字。《特》283页：“拿[方]na²(动词)申请；申领；获得。例如；已拿到英国电子工程博士学位的曾小明，于1991年从中国来我国，在生产力与标准局工作。”
  - 闽南方言词语。多用于口语。在新加坡，“拿[kiah⁸]”的使用频率相当高。
  - 新加坡的学者在评述这种语用现象时说：“英语的 take 字千变万化，并不单作“拿”解。”“这种乱“拿”的情形，也许是一种语文污化的现象。这种现象的产生，主要是把不同用法的 take 直接译为拿，然后与其他词语互相搭配的结果。”(林万菁：《华语趣谈‘拿’照片》，教育出版私营有限公司，1995年，新加坡)马来西亚也用。
  - 据我们考察，在福建闽南地域，表示“获取”这个意义，泉州人也有用“揭”，厦门、漳州人一般用“拿”。
  例句: []
