  词条: 拜年
  音标:
  - pai⁵⁻³ ni²
  释义:
  - 也叫拜正，贺正。传统习俗，是晚辈向长辈拜年，也有亲戚朋友间互相登门恭贺新禧的。旧俗是贺客登门后，延请入大厅坐，然后敬以甜品甜茶，谓之“食甜[tsiah⁸⁻⁵ tɪ¹]”，以示甜蜜圆满。宾主还要互道吉利语。吉利语常根据对象及需要，用带有押韵的语句说出，诸如“食甜甜，互你趁大钱(吃甜甜，祝你赚大钱)”，“食甜甜，互你食百二(吃甜甜，祝你长寿超百年)”，“食甜甜，互你生后生(食甜甜，祝你添个小男丁)”，等等，见有携带小孩的，还要施予“红包”。现在新潮，拜年时多提着装有一对红柑的袋袋或小提篮。这是因为，在粤语里，“金”与“柑”谐音，送柑就是送金，预示好兆头。在闽南话里，“柑”也叫“大桔”，即祝人“大吉大利”。要注意的是，送柑必须是两个或四个，即成双成对，以表示“好事成双”的理念。接收红柑的人必须还礼，不能让送柑者空手而归。此外，不少会馆和社会团体还选择“新正”的一个时间，邀集所属成员进行集体“团拜”，同时举行各种娱乐表演等，这既节省朋友、同事间各自进行拜年所耗费的大量时间，同时也使节日的欢乐气氛显得更加浓烈
  例句: []
