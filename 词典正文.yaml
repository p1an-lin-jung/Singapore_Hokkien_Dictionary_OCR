  - 即婴儿满周岁也。庆祝婴儿满周岁叫“做度晬”。送“油饭”、送“红龟馃[ku¹⁶ ke(ka, kue)³]”等或者“办桌”宴请亲友是庆祝婴孩“度晬”的主要方式，受礼者也依各自的习惯回礼答谢。有些家庭还于是日敬神拜祖。旧俗中“度晬”最有趣的活动莫过于“试周”了，它继承古代“咀盘”之仪，通常是把十二种物品放在竹筛里，如书、笔、墨、算盘、鸡腿、猪肉、尺、斧、葱、芹菜、田土、稻草、秤等，以此象征婴孩不同的资质和未来的职业、前程或命运，“试周”时，要让婴孩坐在筛中，任其择取竹筛里的一物，并凭其所择取之物来卜兆婴孩的未来。如婴孩摸到“印”，即为做官之命，摸到书，即为读书人，择取到算盘或秤，日后可能成为商贾，摸到葱，说明资质聪颖，拿到芹菜，表明资质勤勉，等等。尽管看来未免是可爱的愚蠢之举，但却反映了父母长辈对下一代命运的深切关怀和寄予的厚望
