  释义:
  - ①即坟地的地理位置，也用来指代坟墓。旧时人们多认为，先辈死后墓地地理位置的选择会影响到后代子孙的祸福，所以给死者择个吉利的葬身之地十分重要。不少人不惜重金聘请“风水先[sian¹]”来占卜墓地地势方位之吉凶。有些迷信者把家业不振或子孙不平安之事，都归咎于祖先墓地的风水不好，于是请“风水先”重新占卜择地改葬，不少人常陷进一些术士的欺骗而损失不少：看～（看坟墓的地理位置）|做～（做坟墓）②风水其实就是天地之气，广义解释是“藏风得水”。由于民间盛行风水兆吉凶之说，所以风水不仅限于择墓地，大凡建庙宇、盖屋舍，甚至跟动土有关的一些小建筑，择地都属风水范围
