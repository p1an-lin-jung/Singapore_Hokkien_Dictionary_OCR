  词条: 合目
  音标:
  - kah⁷⁻³bak⁸
  释义:
  - 看了满意，顺眼
  - 辨："合意"、"合目"和"私合"在表示满意、中意的意思时，是一组同义词。不过，"合意"重在打自心里满意，能接受和同意；"合目"重在看了后顺眼或满意；"私合"既有"合意"、"合目"的意思，又有因中意或满意而引申为做动词"喜欢"的意思。"合目"和"合意"常可互相替代、换说，但有时却不好换说。比如"恁两个的代志(指婚事)会好势𣍐好势，着恁两个家己看会合意抑𣍐合意(你们俩的婚事能成不能成，得看你们俩自己中意不中意呀)"这里的"合意"换说"合目"就不够味儿，因为"合目"比较具体，多偏于感官上的，而"合意"不仅感官，还要注意到内心世界的感受，比较深层次些。凡用"合意"、"合目"的地方，一般都可用"私合"替换。本地用"私合"的频率比"合意"、"合目"高
  例句: []
