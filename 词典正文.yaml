    khan¹](间隔休息一天)，初七七元(有说初七叫‘七元日’，也就是‘人日’)，初八原全(指新年诸事告一段落)，初九‘天公生’(玉皇大帝诞辰)，初十有‘食食[tsiah⁸⁻⁵ sit⁸]’(因初九天公生的供祭品多，此日还可享用)，十一请囝婿，十二转[tŋ³]去拜(女儿回娘家)，十三关帝爷生(关帝爷诞辰)，十四结灯棚[teŋ¹⁻⁶
