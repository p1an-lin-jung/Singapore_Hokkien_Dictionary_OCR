  正文页码: 233
  pdf全文页码: 299
  词条: 死
  音标:
  - sī³
  释义:
  - （生物）失去生命，“生”或“活”的反面。“死”是中性的说法。“人”死的说法还有许多。这里举一些常见的说法，如借用马来语做为外来语的“马滴[ma¹⁻⁶tih⁸]”，较庄重的说法是“过身”、“百年[pah⁷⁻³ni²]”、“百岁”、“过气”；还有“老去”、“老咯”，等等；还有一些是戏谑或不庄重的说法，如“行去[kiā²khì]”、“蟯去[ŋiauʰ⁷khì]”等。要注意这些戏谑或不庄重的说法使用的对象和场合，否则会产生不好的后果
  - 拼死地，不顾一切地
  - 固定不流动的，没有活源头的
  - 死板，不灵活
  - 放在某些形容词后，表示程度达到极点，有的可读轻声，也可重叠使用，以加重语气，重叠使用不能读轻声
  - 重叠后放在某些动词的后头，充当补语，相当华语“…紧(紧)的”
  - 口头禅，多放在句首做插入语，表示“糟了”、“坏了”等意思
  - ①义常见生动形式常例：死翘翘
  - ④义常见生动形式举例：死丁丁
  例句:
  - 伊做代志～～迄几谱，猃晓变通（他做事死板板就那几招儿，不懂得变通想办法）
  - 孽[gia̍t⁸]～（调皮极了）
  - 坏[phāi³]～（坏透了）
  - 热～～（热极了）
  - 看～～（看得紧紧的）
  - 捏～～（捏得紧紧的）
  - ～！镭下[hē⁶]在桌屉猃记锁（糟了，钱放在抽屉里忘记上锁了）
