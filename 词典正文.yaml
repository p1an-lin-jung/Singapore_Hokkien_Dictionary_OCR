- id: 367
  正文页码: 16
  pdf全文页码: 82
  词条: 圣淘沙
  音标:
  - seŋ⁵⁻³ to²⁻⁵ sa¹
  释义:
  - 离新加坡市区中心南部半公里远，以一条堤道跨海大桥与新加坡大陆相连接。圣淘沙原名 Blakang Mati，现马来文叫 sentosa，是和平与宁静的意思。原为一个渔村小岛，现成为旅游度假岛屿。岛内有高37公尺的鱼尾狮塔、新加坡万象馆、西乐索炮台、音乐喷泉、海底世界、梦幻岛水上乐园、疯狂电影院、火焰山、sijori
    高尔夫球场、蝴蝶园、世界昆虫博物馆、胡姬园、亚洲村和海事博物馆以及诱人的细白沙滩等。自然天地的仙姿美色和欢乐天地的奇观异景，惊心动魄的感官刺激和赏心悦目的心灵陶醉，巧妙和谐地融合一起，是人们消闲旅游度假的理想去处
  例句: []
- id: 368
  正文页码: 16
  pdf全文页码: 82
  词条: 亚洲村
  音标:
  - a¹⁻⁶ tsiu¹⁻⁶ tshun¹
  释义:
  - 位于圣淘沙入口处，紧邻渡船码头。亚洲村分北亚、东亚和东南亚三个主题区，展示着各区特有的文物、手工艺品和纪念品，供应着亚洲的美食和点心、甜品。亚洲民俗文艺表演和音乐舞蹈表演更是十分精彩。“亚洲探险游乐园”的新奇和刺激会让人大呼过瘾。周游该村，可以遍览亚洲各民族博大精深的历史文化
